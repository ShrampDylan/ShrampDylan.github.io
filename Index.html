<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHRAMP - Shramp World Order</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --sea-light: #4cc9f0;
            --sea-dark: #0077b6;
            --ca-bg: #023e8a;
            --nad-purple: #9d4edd;
            --tg-blue: #0088cc;
            --dex-black: #121212;
            --x-black: #242424;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Fredoka One', cursive;
            /* Deep aquatic gradient */
            background: linear-gradient(180deg, var(--sea-light) 0%, var(--sea-dark) 50%, #001219 100%);
            background-attachment: fixed;
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        /* Animated Bubbles */
        .bubble-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
        }

        .content {
            position: relative;
            z-index: 10;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Large Logo */
        .logo-img {
            max-width: 95%;
            width: 900px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        /* Shrimp Hero */
        .shrimp-hero {
            width: 250px;
            animation: bobbing 3s ease-in-out infinite;
            margin: 30px 0;
        }

        @keyframes bobbing {
            0%, 100% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-25px) rotate(5deg); }
        }

        /* CA Section */
        .ca-container {
            margin: 40px 0;
            width: 100%;
            max-width: 600px;
        }

        .ca-label { 
            font-size: 1.6rem; 
            margin-bottom: 15px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3); 
        }
        
        .ca-box {
            background-color: var(--ca-bg);
            padding: 20px;
            border-radius: 20px;
            border: 4px solid #fff;
            font-family: monospace;
            font-size: 1.2rem;
            word-break: break-all;
            box-shadow: 0 10px 0px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: 0.2s;
        }

        .ca-box:hover {
            transform: scale(1.02);
        }

        /* Lore Section */
        .lore-section {
            margin: 60px 0;
            max-width: 700px;
        }

        .lore-text {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #ffde59;
            text-shadow: 2px 2px 0px #000;
        }

        .lore-img-link img {
            width: 100%;
            border-radius: 20px;
            border: 6px solid white;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .lore-img-link img:hover { 
            transform: scale(1.03); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        /* 2x2 Button Grid */
        .button-grid {
            margin: 60px 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 650px;
        }

        .btn {
            padding: 25px 10px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-size: 1.5rem;
            border: 4px solid #fff;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 0px rgba(0,0,0,0.2);
        }

        .btn:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 12px 0px rgba(0,0,0,0.2); 
        }

        .btn-nad { background-color: var(--nad-purple); }
        .btn-dex { background-color: var(--dex-black); }
        .btn-x { background-color: var(--x-black); }
        .btn-tg { background-color: var(--tg-blue); }

        footer {
            padding: 80px 20px;
            opacity: 0.8;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            .button-grid { grid-template-columns: 1fr; }
            .logo-img { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="bubble-container" id="bubbles"></div>

    <div class="content">
        <!-- Enlarged Logo -->
        <img src="logo.png" alt="SHRAMPVERSE" class="logo-img">

        <!-- Shrimp Character -->
        <img src="shrimp.png" alt="Shramp" class="shrimp-hero">

        <!-- Contract Section -->
        <div class="ca-container">
            <div class="ca-label">Contract Address</div>
            <div class="ca-box" onclick="copyCA()">
                0x42a4aA89864A794dE135B23C6a8D2E05513d7777
            </div>
            <p style="margin-top:10px; font-size: 0.8rem;">Click to copy</p>
        </div>

        <!-- Lore Section -->
        <div class="lore-section">
            <div class="lore-text">The lore of Shramp runs deep on Monad</div>
            <a href="https://x.com/keoneHD/status/1771631102601388382?s=20" target="_blank" class="lore-img-link">
                <img src="lore.png" alt="Keone Hon Shramp Tweet">
            </a>
        </div>

        <!-- 2x2 Button Grid -->
        <div class="button-grid">
            <a href="https://nad.fun/tokens/0x42a4aA89864A794dE135B23C6a8D2E05513d7777" target="_blank" class="btn btn-nad">Nad.Fun</a>
            <a href="https://dexscreener.com/monad/0x42a4aA89864A794dE135B23C6a8D2E05513d7777" target="_blank" class="btn btn-dex">Dexscreener</a>
            <a href="https://www.x.com/ShrampX" target="_blank" class="btn btn-x">ShrampX</a>
            <a href="https://www.t.me/ShrampTG" target="_blank" class="btn btn-tg">ShrampTG</a>
        </div>

        <footer>
            <p>© 2026 Shrampverse</p>
            <p>Shramp World Order on Monad</p>
        </footer>
    </div>

    <script>
        // Bubble Generator
        function createBubbles() {
            const container = document.getElementById('bubbles');
            for (let i = 0; i < 35; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 45 + 10 + 'px';
                bubble.style.width = size;
                bubble.style.height = size;
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.animationDuration = Math.random() * 5 + 7 + 's';
                bubble.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(bubble);
            }
        }

        // Copy Function
        function copyCA() {
            const ca = "0x42a4aA89864A794dE135B23C6a8D2E05513d7777";
            navigator.clipboard.writeText(ca);
            alert("Contract Address copied to clipboard!");
        }

        createBubbles();
    </script>
</body>
</html>
